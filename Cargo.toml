[workspace]
members = [".", "agent-tab"]

[package]
name = "worktree-cli"
version = "0.3.0"
edition = "2021"
authors = ["Project FPA"]
description = "A CLI tool to manage Git worktrees with interactive selection and terminal integration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.26"
crossterm = "0.27"

[[bin]]
name = "worktree-cli"
path = "src/main.rs"
