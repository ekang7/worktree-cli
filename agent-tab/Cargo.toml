[package]
name = "agent-tab"
version = "0.1.0"
edition = "2021"
authors = ["Project FPA"]
description = "CLI tool for opening/closing terminal tabs with AI coding agents (Claude Code, Codex)"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"

[[bin]]
name = "agent-tab"
path = "src/main.rs"
